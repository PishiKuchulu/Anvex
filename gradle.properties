# Project-wide Gradle settings
# v4.6: raised from 1536m — packaging ABI splits copies the ~60MB libnode.so
# per architecture and :app:packageDebug died with "Java heap space" in
# IncrementalSplitterRunnable (CI run 39524200243). CI runners have the RAM;
# local low-memory machines can override with -Dorg.gradle.jvmargs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# v4.10.1 (CI-05): org.gradle.parallel was set twice (false, then true);
# properties files take the LAST value, so the false line was dead weight.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# v4.1 (Nebula): org.gradle.java.home removed — the JVM is resolved from
# JAVA_HOME / PATH (JDK 17 required) so the tree builds on any machine.
# v4.4 (raised 2026-10-29): Kotlin daemon heap was 1024m and CodeQL
# autobuild died with "GC overhead limit exceeded" in :app:compileDebugKotlin.
# CI runners have the RAM; local low-memory machines can override with
# -Dkotlin.daemon.jvmargs.
kotlin.daemon.jvmargs=-Xmx4g
