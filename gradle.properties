# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# v4.1 (Nebula): org.gradle.java.home removed — the JVM is resolved from
# JAVA_HOME / PATH (JDK 17 required) so the tree builds on any machine.
# v4.4: 4GB build-box profile — smaller heaps so the daemon survives.
kotlin.daemon.jvmargs=-Xmx1024m
