# M-14: automated dependency updates for the action pins and the Gradle
# version catalog. Security updates land as PRs; they never auto-merge —
# the CI test job gates every one.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # E2: SHA-pinned actions only stay current if bumps are cheap to review — one grouped PR.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
