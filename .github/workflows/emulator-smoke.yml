name: Emulator smoke (bundled Node runtime)

# Boots an x86_64 emulator, installs the :core:android test APK and runs ALL of its instrumented
# tests (NodeRuntimeSmokeTest, NodeLineDeliveryTest, PiRuntimeTest, PiEngineTest, PiChatBridgeTest,
# PiPocTest): loading the JNI bridge proves libnode.so and its full DT_NEEDED closure resolve on a
# real Android linker.
#
# E3: this used to be manual-only, so a regression in the native/Pi runtime was invisible until
# someone remembered to dispatch it. It now also runs nightly on the default branch (schedules only
# ever run there). If a POC test turns out to be flaky, exclude it in the script line below rather
# than dropping the schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"   # 02:23 UTC daily

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Explicit list (same as build-apk.yml): the action's default set
          # includes the legacy 'tools' package, which current cmdline-tools
          # no longer offer ("Failed to find package 'tools'").
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1 emulator'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4android.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented smoke test on emulator
        # E2: still a floating tag. This repo has no pinned SHA for this action and none could be looked
        # up offline — pin it to a reviewed commit SHA (Dependabot will then keep it current).
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :core:android:connectedDebugAndroidTest --stacktrace
      - name: Dump instrumented test reports (POC metrics)
        if: always()
        run: |
          for f in core/android/build/outputs/androidTest-results/connected/debug/*.xml core/android/build/outputs/androidTest-results/connected/debug/*.json; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          grep -rh "PI-POC-RESULTS" core/android/build/outputs/androidTest-results/ 2>/dev/null | head -3 || true
