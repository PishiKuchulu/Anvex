name: Emulator smoke (bundled Node runtime)

# Boots an x86_64 emulator, installs the :core:android test APK and runs
# NodeRuntimeSmokeTest: loading the JNI bridge proves libnode.so and its
# full DT_NEEDED closure resolve on a real Android linker. Manual dispatch
# only — it is a release gate for runtime-package changes, not a per-push
# check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit list (same as build-apk.yml): the action's default set
          # includes the legacy 'tools' package, which current cmdline-tools
          # no longer offer ("Failed to find package 'tools'").
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1 emulator'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :core:android:connectedDebugAndroidTest --stacktrace

      - name: Dump instrumented test reports (POC metrics)
        if: always()
        run: |
          for f in core/android/build/outputs/androidTest-results/connected/debug/*.xml core/android/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
