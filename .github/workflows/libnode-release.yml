name: Build libnode 24 release (Termux nodejs-lts, all ABIs)

# Phase 1a of the harness-engine roadmap: produce Anvex's own hash-pinnable
# libnode 24.22.1 package for Android — bin/<abi>/libnode.so plus its exact
# DT_NEEDED dependency closure, and include/node headers from the official
# Node.js v24.22.1 source tarball — published as the GitHub Release
# "libnode-v24.22.1" (asset anvex-libnode-24.22.1.zip). The app build pins
# this zip by SHA-256 in core/android/build.gradle.kts (downloadNodeLibs).
#
# LESSON (run 39676591153, failed): Termux's published nodejs-lts deb ships
# NO libnode.so — it builds Node monolithically (bin/node only, 10 MB deb).
# Fix: patch build.sh locally to add Node's --shared flag before building,
# so make install also ships lib/libnode.so* in the deb.
# Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24.22.1"

jobs:
  build:
    name: Build ${{ matrix.termux_arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: x86_64
            android_abi: x86_64
          - termux_arch: aarch64
            android_abi: arm64-v8a
          - termux_arch: arm
            android_abi: armeabi-v7a
    steps:
      - name: Clone termux-packages (shallow)
        run: git clone --depth 1 https://github.com/termux/termux-packages.git tp

      - name: Patch nodejs-lts build to produce a shared libnode
        run: |
          grep -n -- '--ninja' tp/packages/nodejs-lts/build.sh
          sed -i 's|--ninja \\|--ninja \\\n\t\t--shared \\|' tp/packages/nodejs-lts/build.sh
          grep -n -- '--shared' tp/packages/nodejs-lts/build.sh | head -5

      - name: Build nodejs-lts (Node ${{ env.NODE_VERSION }}) for ${{ matrix.termux_arch }}
        working-directory: tp
        run: ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.termux_arch }} -I nodejs-lts

      - name: Fetch dependency debs for the closure (index-verified)
        # build-package.sh -I installs dependency debs inside the docker
        # container only; output/ holds just the nodejs-lts deb. Fetch the
        # same packages from the Termux apt repo so the closure step sees
        # libz.so.1, libcares.so, libsqlite3.so, libssl/libcrypto.so.3 and
        # libicu*.so.78 next to libnode.so.
        env:
          TERMUX_ARCH: ${{ matrix.termux_arch }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, os, urllib.request
          REPO = "https://packages.termux.dev/apt/termux-main"
          WANT = {"zlib", "c-ares", "openssl", "libicu", "libsqlite"}
          def fetch(url):
              with urllib.request.urlopen(url) as r: return r.read()
          raw = fetch(f"{REPO}/dists/stable/main/binary-{os.environ['TERMUX_ARCH']}/Packages")
          entries, cur = [], {}
          for line in raw.decode().splitlines():
              if not line.strip():
                  if cur: entries.append(cur)
                  cur = {}
              elif ": " in line:
                  k, v = line.split(": ", 1); cur[k] = v
          if cur: entries.append(cur)
          got = set()
          for e in entries:
              if e.get("Package") not in WANT: continue
              data = fetch(f"{REPO}/{e['Filename']}")
              assert hashlib.sha256(data).hexdigest() == e["SHA256"], e["Package"]
              open(f"tp/output/{os.path.basename(e['Filename'])}", "wb").write(data)
              got.add(e["Package"])
              print("fetched", e["Package"], e["Version"])
          assert got == WANT, f"missing: {WANT - got}"
          PYEOF

      - name: Diagnose package contents
        run: |
          for d in tp/output/*.deb; do
            echo "== $(basename "$d") $(stat -c%s "$d") bytes"
            ar t "$d"
            ar p "$d" data.tar.xz | tar -tJf - | grep -E "libnode|\.so" | head -30 || true
          done

      - name: Extract packages and compute libnode dependency closure
        run: |
          set -euo pipefail
          mkdir -p extract
          for d in tp/output/*.deb; do
            dest="extract/$(basename "$d" .deb)"
            mkdir -p "$dest" && cd "$dest" && ar x "$OLDPWD/$d" && tar -xf data.tar.xz && cd "$OLDPWD"
          done
          echo "=== libnode candidates anywhere in extracted packages ==="
          find extract -name "libnode.so*" | head
          mkdir -p "stage/${{ matrix.android_abi }}"
          # Transitive DT_NEEDED closure of libnode.so, restricted to libs
          # that ship in the extracted packages. System libs (libc, libm,
          # libdl, liblog, libandroid) are provided by Android itself.
          # Symlink-aware: real files copied once, links recreated as links.
          python3 - "stage/${{ matrix.android_abi }}" <<'PYEOF'
          import os, re, subprocess, sys
          outdir = sys.argv[1]
          libs = subprocess.run(['find', 'extract', '-name', '*.so*'],
                                capture_output=True, text=True).stdout.split()
          libs = [p for p in libs if os.path.isfile(p) or os.path.islink(p)]
          if not any(os.path.basename(p).startswith('libnode.so') for p in libs):
              print("FATAL: no libnode.so* found in extracted packages")
              sys.exit(2)
          def soname(path):
              out = subprocess.run(['readelf', '-d', os.path.realpath(path)],
                                   capture_output=True, text=True).stdout
              m = re.search(r'SONAME.*\[(.+?)\]', out)
              return m.group(1) if m else os.path.basename(path)
          def needed(path):
              out = subprocess.run(['readelf', '-d', os.path.realpath(path)],
                                   capture_output=True, text=True).stdout
              return re.findall(r'NEEDED.*\[(.+?)\]', out)
          index = {}
          for p in libs:
              index.setdefault(soname(p), p)
              index.setdefault(os.path.basename(p), p)
          seen, queue = set(), []
          name_for_real = {}
          for p in libs:
              if os.path.basename(p).startswith('libnode.so'):
                  queue.append(os.path.basename(p))
          while queue:
              cur = queue.pop()
              path = index.get(cur)
              if path is None or path in seen:
                  continue
              seen.add(path)
              # Ship each lib under the exact DT_NEEDED name that requested
              # it (SONAME-less libs, e.g. Termux libsqlite3, depend on
              # this); no symlinks (Gradle zip extraction would turn a
              # symlink entry into a text file).
              name_for_real.setdefault(os.path.realpath(path), cur)
              queue.extend(needed(path))
          total = 0
          for real, req_name in sorted(name_for_real.items(), key=lambda kv: kv[1]):
              dest = os.path.join(outdir, req_name)
              with open(real, 'rb') as f, open(dest, 'wb') as g:
                  g.write(f.read())
              total += os.path.getsize(real)
              print(f"{os.path.getsize(real):>12}  {req_name}")
          print(f"closure: {len(name_for_real)} real files, {total} bytes")
          PYEOF
          ls -la "stage/${{ matrix.android_abi }}"

      - name: Stage generated headers (arch-independent, from the same build)
        run: |
          set -euo pipefail
          hdr=$(find extract -type d -path "*usr/include/node" | head -1)
          echo "headers dir: $hdr"
          test -f "$hdr/node.h" && test -f "$hdr/v8.h"
          mkdir -p stage-headers && cp -r "$hdr" stage-headers/node
          find stage-headers -type f | wc -l

      - name: Upload per-ABI libraries
        uses: actions/upload-artifact@v7
        with:
          name: libnode-libs-${{ matrix.android_abi }}
          path: stage/${{ matrix.android_abi }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated headers
        if: matrix.android_abi == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: libnode-headers
          path: stage-headers/node/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble and publish libnode release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download per-ABI libraries and headers
        uses: actions/download-artifact@v4
        with:
          pattern: libnode-libs-*
          path: libs

      - name: Download generated headers
        uses: actions/download-artifact@v4
        with:
          name: libnode-headers
          path: headers

      - name: Fetch official Node.js source tarball (npm version only)
        run: |
          set -euo pipefail
          base="https://nodejs.org/dist/v${NODE_VERSION}"
          curl -fsSLO "$base/node-v${NODE_VERSION}.tar.gz"
          curl -fsSLO "$base/SHASUMS256.txt"
          grep " node-v${NODE_VERSION}.tar.gz\$" SHASUMS256.txt | sha256sum -c -
          tar -xzf "node-v${NODE_VERSION}.tar.gz" "node-v${NODE_VERSION}/deps/npm/package.json"
          NPM_VERSION=$(python3 -c "import json; print(json.load(open('node-v${NODE_VERSION}/deps/npm/package.json'))['version'])")
          echo "NPM_VERSION=$NPM_VERSION" >> "$GITHUB_ENV"
          echo "npm bundled with Node ${NODE_VERSION}: $NPM_VERSION"

      - name: Assemble package and manifest
        run: |
          set -euo pipefail
          mkdir -p pkg/bin pkg/include
          for abi in x86_64 arm64-v8a armeabi-v7a; do
            if [ -d "libs/libnode-libs-$abi" ]; then
              mkdir -p "pkg/bin/$abi"
              cp -a libs/libnode-libs-$abi/. "pkg/bin/$abi/"
            fi
          done
          cp -r headers pkg/include/node
          {
            echo "anvex-libnode ${NODE_VERSION}"
            echo "node: ${NODE_VERSION} (LTS), built via Termux nodejs-lts for bionic with --shared"
            echo "npm: ${NPM_VERSION} (version shipped in the official source tarball)"
            echo "layout: bin/<android-abi>/*.so (libnode.so + DT_NEEDED closure; symlinks preserved), include/node/ (generated headers from the same Termux build — guaranteed API match)"
            echo
            find pkg -type f -printf "%s\t%p\n" | sort -k2
          } > pkg/manifest.txt
          cat pkg/manifest.txt
          (cd pkg && zip -r "../anvex-libnode-${NODE_VERSION}.zip" .)
          sha256sum "anvex-libnode-${NODE_VERSION}.zip" | tee "anvex-libnode-${NODE_VERSION}.zip.sha256"

      - name: Publish GitHub Release libnode-v${{ env.NODE_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="libnode-v${NODE_VERSION}"
          notes="Anvex libnode ${NODE_VERSION} package. SHA-256: $(cut -d' ' -f1 "anvex-libnode-${NODE_VERSION}.zip.sha256"). See manifest.txt inside the zip for the per-ABI file list. Built by libnode-release.yml from Termux nodejs-lts (+--shared); headers are the generated ones from the same build (API-guaranteed match)."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "anvex-libnode-${NODE_VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "anvex-libnode-${NODE_VERSION}.zip" --repo "$GITHUB_REPOSITORY" --title "libnode ${NODE_VERSION} (Anvex runtime package)" --notes "$notes"
          fi
