name: Build and verify Anvex APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # M-14: a tampered wrapper must fail here, before any gradlew run.
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install icon verification dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Source and icon audit
        run: |
          python3 tools/deep_audit_30.py
          python3 tools/verify_launcher_icon.py
          python3 tools/verify_room_schema_snapshots.py

      - name: Verify Gradle wrapper can run
        run: ./gradlew --no-daemon --version

      - name: Run aggregate source release gates
        run: python3 tools/final_release_audit.py

      - name: Generate source mirror
        run: python3 tools/build_source_mirror.py

      - name: Verify generated source mirror
        run: python3 tools/verify_source_mirror.py

      - name: Unit tests
        run: ./gradlew --no-daemon :core:engine:test :core:android:testDebugUnitTest :core:ai:test :app:testDebugUnitTest

      - name: Lint (v4.10.1, CI-04)
        # --continue: report every module's lint errors in ONE run instead
        # of stopping at the first failing module.
        run: ./gradlew --no-daemon lintDebug --continue

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvex-lint-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvex-test-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install icon verification dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Source integrity gates
        run: |
          python3 tools/deep_audit_30.py
          python3 tools/verify_room_schema_snapshots.py
          ./gradlew --no-daemon --version
          python3 tools/final_release_audit.py

      - name: Generate source mirror
        run: python3 tools/build_source_mirror.py

      - name: Verify generated source mirror
        run: python3 tools/verify_source_mirror.py

      - name: Clean and build fresh debug APK
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Verify release assembly (v4.10.1, CI-04 — R8/minify gate on every push, not only at tag time)
        run: ./gradlew --no-daemon :app:assembleRelease

      # v4.6: ABI splits renamed the outputs — the universal APK is now
      # app-universal-debug.apk (app-debug.apk no longer exists), next to
      # app-<abi>-debug.apk per architecture.
      - name: List built APKs
        run: ls -l app/build/outputs/apk/debug/

      - name: Verify launcher icon inside generated APK
        run: python3 tools/verify_launcher_icon.py --apk app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Write build provenance and checksums
        run: python3 tools/write_apk_build_info.py app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anvex-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/BUILD-INFO.txt
            app/build/outputs/apk/debug/app-universal-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: apk
    # v4.10.1 (CI-01): this job replaces the shared rolling `latest` release.
    # The workflow also triggers on pull_request, and the job previously had
    # no condition — a same-repo PR run would have REPLACED the published
    # debug APK with unreviewed PR code while the PR was still open.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: anvex-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/

      - name: Publish rolling release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: latest
          name: "Latest build — آخرین بیلد"
          body: |
            Rolling debug build of Anvex from the latest `main` commit.
            Install at your own risk — this is a debug build for testing, not a signed release.

            بیلد دیباگِ آخرین کامیتِ main — برای تست است، نه انتشار نهایی.
          files: dist/app-universal-debug.apk
