name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read # least privilege: only the publishing job below gets write

concurrency:
  group: anvex-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # M-14: all actions pinned by commit SHA (a floating @v4 tag can be
      # moved by its owner). SHAs resolved 2026-10-29 via git ls-remote.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      # v4.10.1 (CI-03): a signed release must pass the unit suite first —
      # previously this workflow built and published with no test gate.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:engine:test :core:android:testDebugUnitTest :core:ai:test :app:testDebugUnitTest

      - name: Tag matches versionName (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$TAG_VERSION versionName=$APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match versionName $APP_VERSION in app/build.gradle.kts"
            exit 1
          fi

  signed-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Gives the signing secrets a protection point: add required reviewers to the
    # "release" environment (Settings -> Environments) to gate every signed release.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Restore signing key from repo secrets
        # M-14: the secret travels via env, not shell interpolation —
        # interpolated secrets can leak into step logs on failure.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          ls -l "${{ runner.temp }}/release.keystore"

      # REL-001 (forensic audit, 2026-11-07): build-apk.yml generates and
      # verifies the in-app source mirror, but this workflow never did —
      # so signed release APKs silently shipped without the mirror asset
      # the Developer Center reads. Same two steps, before the build.
      - name: Generate source mirror
        run: python3 tools/build_source_mirror.py

      - name: Verify generated source mirror
        run: python3 tools/verify_source_mirror.py

      - name: Build signed release APK
        # v4.10.1 (CI-03): signing values travel via ORG_GRADLE_PROJECT_* env
        # vars instead of -P command-line properties (which leak into process
        # lists and Gradle daemon/build-scan logs).
        env:
          ORG_GRADLE_PROJECT_ANVEX_KEYSTORE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_ANVEX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ANVEX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ANVEX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:assembleRelease

      # REL-002 (forensic audit, 2026-11-07): the native-library smoke
      # check used to run only against the DEBUG universal APK (as an
      # assembleDebug finalizer). Run it against the release universal
      # APK that is about to be published.
      - name: Verify release native libraries
        run: ./gradlew --no-daemon :app:verifyNativeLibs -PanvexVerifyApk=outputs/apk/release/app-universal-release.apk

      # REL-002: the published APKs must carry the live release key —
      # verify the signer digest before anything is renamed or published.
      - name: Verify signer fingerprint
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -oP 'SHA-256 digest: \K[0-9a-f]+')
          echo "signer SHA-256: $CERT"
          test "$CERT" = "43c337ec53d1ddb5cab7ba907ff59336ea39da9509173a08c6a53b8a0f1012ef"

      - name: Rename APKs with version + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/release
          # v4.6: ABI splits — app-universal-release.apk is the universal
          # APK; each app-<abi>-release.apk becomes Anvex-<version>-<abi>.apk.
          for apk in app-*.apk; do
            case "$apk" in
              app-universal-release.apk) name="Anvex-${VERSION}" ;;
              app-*-release.apk) abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/'); name="Anvex-${VERSION}-${abi}" ;;
              *) continue ;;
            esac
            mv "$apk" "${name}.apk"
            sha256sum "${name}.apk" > "${name}.apk.sha256"
          done
          ls -l
          cat Anvex-*.apk.sha256

      - name: Publish signed release
        # v4.10.1 (CI-03): a manual dispatch from a branch still builds (and
        # the rename step shows the artifacts in the log) but must not
        # publish a "release" from an arbitrary ref — publishing is for
        # version tags only.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            app/build/outputs/apk/release/Anvex-*.apk
            app/build/outputs/apk/release/Anvex-*.apk.sha256
          name: Anvex ${{ github.ref_name }} (signed)
      - name: Archive R8 mapping for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
