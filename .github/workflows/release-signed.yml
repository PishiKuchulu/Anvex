name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anvex-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from repo secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
          ls -l "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        run: >
          ./gradlew --no-daemon clean :app:assembleRelease
          -PANVEX_KEYSTORE=${{ runner.temp }}/release.keystore
          -PANVEX_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          -PANVEX_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          -PANVEX_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs with version + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/release
          # v4.6: ABI splits — app-universal-release.apk is the universal
          # APK; each app-<abi>-release.apk becomes Anvex-<version>-<abi>.apk.
          for apk in app-*.apk; do
            case "$apk" in
              app-universal-release.apk) name="Anvex-${VERSION}" ;;
              app-*-release.apk) abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/'); name="Anvex-${VERSION}-${abi}" ;;
              *) continue ;;
            esac
            mv "$apk" "${name}.apk"
            sha256sum "${name}.apk" > "${name}.apk.sha256"
          done
          ls -l
          cat Anvex-*.apk.sha256

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Anvex-*.apk
            app/build/outputs/apk/release/Anvex-*.apk.sha256
          name: Anvex ${{ github.ref_name }} (signed)
